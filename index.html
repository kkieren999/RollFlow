/* RollFlow teacher sidebar — PaperCut-inspired utilitarian navigation */
:root{--navy:#102130;--navy2:#293f51;--green:#168a38;--green-dark:#0f762e}
.sidebar{width:244px;flex:0 0 244px;position:relative;transition:width .15s ease,flex-basis .15s ease;z-index:21;min-width:0}
.brand{height:84px;flex:0 0 84px;gap:10px;padding:0 15px;border-bottom:1px solid #334656}
.brand-icon-new{width:37px;height:37px;display:flex;align-items:center;justify-content:center;background:#168a38;border-radius:6px;color:#fff;flex:none}
.brand-icon-new svg{width:23px;height:23px}
.brand-word{font-size:23px;letter-spacing:-.9px;white-space:nowrap}
.brand-word small{font-size:10px;letter-spacing:1.35px;color:#aab8c3;margin-top:7px}
.side-collapse{width:23px;height:30px;margin-left:auto;border:0;background:transparent;color:#aab9c4;display:grid;place-items:center;flex:none}
.side-collapse:hover{color:#fff}
.side-nav{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#435665 transparent}
.nav-primary{padding:13px 10px 7px}
.nav-utility{padding:12px 10px 10px;border-top:1px solid #334656;margin-top:10px}
.nav-item{min-height:46px;border:0;border-radius:3px;gap:13px;padding:0 13px;margin-bottom:3px;font-size:13.5px;color:#d2dde5}
.nav-item:last-child{border:0}
.nav-item.active{background:#168a38;border:0;padding:0 13px;font-weight:700}
.nav-item.active .nav-icon{color:#fff}
.nav-item:hover{background:#1c3548;color:#fff}
.nav-item.active:hover{background:#158335}
.nav-icon{color:#b9c7d1;display:flex;align-items:center;justify-content:center;flex:0 0 20px}
.nav-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{border-top:1px solid #334656;padding:9px 10px 11px;position:relative;margin-top:0;font-size:inherit;color:inherit}
.profile-button{width:100%;display:flex;align-items:center;text-align:left;gap:10px;background:transparent;border:0;border-radius:4px;padding:9px 5px;color:#fff}
.profile-button:hover{background:#1c3548}
.profile-avatar{width:36px;height:36px;flex:none;display:grid;place-items:center;background:#314c60;color:#fff;border-radius:50%;font-size:12px;font-weight:700}
.profile-text{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.profile-text b{color:#fff;margin:0;font-size:12px}
.profile-text small{color:#aab8c3;font-size:11px}
.profile-chevrons{color:#b9c7d1;display:flex}
.profile-chevrons svg{width:16px;height:16px}
.profile-popover{position:absolute;left:13px;bottom:73px;width:241px;background:#fff;color:#324452;z-index:50;box-shadow:0 8px 36px #0004;border:1px solid #dae1e5;border-radius:4px;padding:15px;display:flex;flex-direction:column;gap:5px}
.profile-popover strong{font-size:13px}.profile-popover span{font-size:11px;color:#637581}.profile-popover button{margin-top:12px;display:flex;align-items:center;gap:9px;border:1px solid #dce2e6;padding:9px;background:#f8fafa;color:#253f52;border-radius:3px;text-align:left}
.profile-popover button:hover{background:#e9f1ef}
.sidebar.collapsed{width:66px;flex:0 0 66px}
.sidebar.collapsed .brand{height:76px;flex-basis:76px;padding:0;justify-content:center}
.sidebar.collapsed .brand-word,.sidebar.collapsed .side-collapse,.sidebar.collapsed .nav-text,.sidebar.collapsed .profile-text,.sidebar.collapsed .profile-chevrons{display:none}
.sidebar.collapsed .nav-primary,.sidebar.collapsed .nav-utility{padding-left:7px;padding-right:7px}
.sidebar.collapsed .nav-item{padding:0;justify-content:center}
.sidebar.collapsed .nav-item.active{padding:0}
.sidebar.collapsed .side-foot{padding:8px 8px 12px}
.sidebar.collapsed .profile-button{justify-content:center;padding:5px 0}
.sidebar.collapsed .profile-popover{left:60px;bottom:11px}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.header-menu{height:30px;width:30px;border:1px solid #5cb068;background:transparent;color:white;display:grid;place-items:center;border-radius:3px}
.header-menu:hover{background:#087126}
.mobile-menu{display:none}

function fitGrid(){if(state.page!=='roll')return;const wrap=document.querySelector('.student-grid-wrap'),grid=document.querySelector('.student-grid');if(!wrap||!grid)return;const count=getClass().ids.length;let width=wrap.clientWidth-20,height=wrap.clientHeight-20;const gap=window.innerWidth<=600?3:7;let best=null;for(let cols=4;cols<=12;cols++){let rows=Math.ceil(count/cols);let cellW=(width-(cols-1)*gap)/cols,cellH=(height-(rows-1)*gap)/rows;let imgW=Math.min(cellW-10,(cellH-(window.innerWidth<=600?44:58))*.75);let imgH=Math.min(cellH-48,imgW*4/3);if(cellW<43||imgH<30)continue;let score=imgW*imgH + (cols<=10?40:0) - (cellH<100?200:0);if(!best||score>best.score)best={cols,rows,score}}if(!best)best={cols:5,rows:Math.ceil(count/5)};grid.style.setProperty('--cols',best.cols);grid.style.setProperty('--rows',best.rows)}
function roll(){const c=getClass(),counts=classCounts(c),locked=isSubmitted(),done=c.ids.length-counts['?'];const cards=c.ids.map(id=>{const p=getPerson(id),s=statusFor(id),names=p.name.split(' ');return `<button type="button" class="student-card ${s!=='?'?'is-'+s.toLowerCase():''}" data-mark="${id}" aria-label="${esc(p.name)}, ${s==='?'?'unmarked':s==='P'?'present':s==='A'?'absent':s==='L'?'late':'activity'}" ${locked?'disabled':''}><span class="tile-head"><span class="tile-state">${s==='P'?'✓':s==='A'?'×':s==='L'?'L':s==='X'?'ACT':'?'}</span><span class="tile-more" data-more="${id}" role="button" tabindex="0" aria-label="More options for ${esc(p.name)}">⋮</span></span><span class="portrait-area"><img src="${photo(p)}" alt=""></span><span class="tile-name">${esc(p.name)}</span></button>`}).join('');const body=`<div class="roll-heading"><div><button class="back-link" data-nav="${state.rollOrigin}">← ${state.rollOrigin==='class-detail'?'Class details':state.rollOrigin==='finder'?'Class Finder':'My timetable'}</button><div><strong>${esc(c.id)} — ${esc(c.name)}</strong> <span class="period"> · ${c.period} · ${c.room} · ${c.time}</span></div></div><div class="right-actions"><select class="field-select" data-class-select aria-label="Select class">${schoolClasses.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.period} · ${x.id}</option>`).join('')}</select></div></div><section class="sheet attendance-sheet"><div class="attendance-head"><strong>CLASS ROLL &nbsp; · &nbsp; ${c.ids.length} STUDENTS</strong><small>${niceDate()} ${locked?'· Submitted':''}</small></div><div class="attendance-toolbar"><div class="summary-stats"><div class="counter"><span class="digit" id="count-q">${counts['?']}</span><span>Unmarked</span></div><div class="counter green"><span class="digit" id="count-p">${counts.P}</span><span>Present</span></div><div class="counter red"><span class="digit" id="count-a">${counts.A}</span><span>Absent</span></div><div class="counter amber"><span class="digit" id="count-l">${counts.L}</span><span>Late</span></div><div class="counter blue"><span class="digit" id="count-x">${counts.X}</span><span>Activity</span></div></div><div class="teacher-hint" style="${state.prefs.showHints?'':'display:none'}"><b>Click a portrait:</b> &nbsp;? → ✓ → × → ?<br>Use ⋮ for other attendance options</div></div><div class="student-grid-wrap"><div class="student-grid">${cards}</div></div><div class="attendance-footer"><div class="footer-message" id="footerMsg">${locked?'<strong>✓ Roll submitted</strong> · Attendance is locked':counts['?']?`<strong>${counts['?']} students</strong> still need marking`:'<strong>All students marked.</strong> Ready to submit.'}</div><div class="footer-actions"><button class="btn small" data-action="undo" ${!state.history.length||locked?'disabled':''}>↶ Undo</button><button class="btn small" data-action="save" ${locked?'disabled':''}>Save</button><button class="btn green" data-action="submit" ${counts['?']||locked?'disabled':''}>${locked?'✓ Submitted':'Submit roll'}</button></div></div></section>`;return shell(body,'Take attendance',`${niceDate()} · ${c.period} · Room ${c.room}`,`<label class="date-inline">Date <input type="date" class="field-date" data-date value="${esc(state.date)}"></label><span class="tag ${locked?'done':'started'}">${locked?'✓ Submitted':'Attendance in progress'}</span>`,true)}
function render(){const savedScroll=0;const views={home,timetable,roll,classes:classOverview,finder:finderPage,'class-detail':finderDetail,search:studentSearchPage,movements:movementsPage,alerts:alertsPage,preferences:preferencesPage,help:helpPage};app.innerHTML=(views[state.page]||home)();if(state.page==='roll'){requestAnimationFrame(fitGrid)}if(state.drawer)drawDrawer();if(state.modal)drawModal()}
function changeMark(id,target=null){if(isSubmitted())return;const k=bucket();state.marks[k]??={};const old=state.marks[k][id]||'?';let next=target||({'?':'P',P:'A',A:'?',L:'P',X:'P'}[old]);if(old===next)return;state.history.push({k,id,old,next});state.marks[k][id]=next;state.dirty=true;persist();render()}

function drawDrawer(){const p=getPerson(state.drawer);if(!p)return;const current=statusFor(p.id),locked=isSubmitted(),inRoll=state.page==='roll'&&getClass().ids.includes(p.id);const actions=[['?','? Unmarked'],['P','✓ Present'],['A','× Absent'],['L','L Late'],['X','ACT Activity']].map(a=>`<button data-direct="${a[0]}" class="${current===a[0]?'active':''}" ${locked?'disabled':''}>${a[1]}</button>`).join('');const note=state.notes[p.id]||'';const passes=(state.passes[p.id]||[]).map(a=>`<div class="info-line">${esc(a)}</div>`).join('');const el=document.createElement('div');el.className='overlay';el.id='overlay';el.innerHTML=`<aside class="drawer" role="dialog" aria-label="Student options" aria-modal="true"><div class="drawer-top"><strong>Student details</strong><button class="xbtn" data-action="closeDrawer" aria-label="Close">×</button></div><div class="drawer-body"><div class="profile-row"><div class="profile-pic"><img src="${photo(p)}" alt=""></div><div class="profile-info"><h2>${esc(p.name)}</h2><div><strong>Year ${p.year}</strong></div><div>Class: ${esc(state.classId)}</div><div>Student ID: ${esc(p.id)}</div><div style="margin-top:10px"><label class="btn small" style="cursor:pointer">▣ Add photo <input type="file" accept="image/jpeg,image/png,image/webp" data-image="${p.id}" style="display:none"></label></div></div></div>${inRoll?`<div class="drawer-section-title">Attendance for this lesson</div><div class="quick-marks">${actions}</div>`:''}<div class="drawer-section-title">Student actions</div><div class="action-list"><button data-action="showTimetable">View timetable <span>›</span></button><button data-action="createPass">Issue toilet pass <span>›</span></button><button data-action="createNote">Attendance comment <span>›</span></button></div><div class="drawer-section-title">Class note</div><textarea class="input-note" id="studentNote" placeholder="Add a private teaching note">${esc(note)}</textarea><div style="margin-top:7px;text-align:right"><button class="btn function drawModal(){const el=document.createElement('div');el.className='modal-shade';el.id='modal';const submitted=state.modal==='submit',searching=state.modal==='search',help=state.modal==='help',timetable=state.modal==='timetable',pass=state.modal==='pass';let title= submitted?'Submit class roll':searching?'Find a student':help?'How to mark attendance':timetable?'Student timetable':pass?'Issue toilet pass':'Attendance';let contents='';if(submitted)contents=`<p>Submit the attendance record for <strong>${esc(getClass().id)}</strong> on ${niceDate()}. The class roll will be locked after submission.</p><label class="checkconfirm"><input type="checkbox" id="certifyCheck">I have checked this class and confirmed each student’s attendance.</label>`;if(searching)contents=`<input type="search" autofocus class="search-box" id="findSearch" placeholder="Search name or student ID" value="${esc(state.search)}"><div id="searchResults">${searchResults()}</div>`;if(help)contents=`<p>Mark each student after visually and verbally checking attendance. Every student begins as <b>?</b>.</p><table class="mini-table"><tr><td>First click</td><td>✓ Present</td></tr><tr><td>Second click</td><td>× Absent</td></tr><tr><td>Third click</td><td>? Unmarked</td></tr><tr><td>Other options</td><td>Use <b>⋮</b> for Late or Activity</td></tr><tr><td>Undo</td><td>Reverses your last change</td></tr></table><div class="info-line">Submit is available only after every student has been marked.</div>`;if(timetable){const p=getPerson(state.drawer);contents=`<p>${esc(p?.name||'Student')} · Today's scheduled classes</p><table class="mini-table">${classes.map(c=>`<tr><td>${esc(c.period)}</td><td>${esc(c.id)} · ${esc(c.room)}</td></tr>`).join('')}</table>`}if(pass){const p=getPerson(state.drawer);contents=`<p>Record a classroom toilet pass for <strong>${esc(p?.name||'Student')}</strong>.</p><label style="font-size:11px">Destination</label><select id="passDestination" class="field-select" style="display:block;width:100%;margin-top:7px"><option>Toilet</option><option>Student services</option><option>School office</option></select>`}el.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2>${title}</h2><button class="xbtn" style="color:#4b5b64" data-action="closeModal">×</button></div><div class="dialog-body">${contents}</div><div class="dialog-footer"><button class="btn" data-action="closeModal">${submitted||pass?'Cancel':'Close'}</button>${submitted?'<button class="btn green" data-action="confirmSubmit" disabled id="confirmSubmit">Submit roll</button>':pass?'<button class="btn green" data-action="confirmPass">Issue pass</button>':''}</div></div>`;el.addEventListener('click',ev=>{if(ev.target===el)closeModal()});document.body.appendChild(el);if(searching)el.querySelector('#findSearch')?.focus()}

document.addEventListener('change',e=>{if(e.target?.id==='certifyCheck'){const b=document.getElementById('confirmSubmit');if(b)b.disabled=!e.target.checked}});
document.addEventListener('input',e=>{if(e.target.matches('input[data-finder-field]')){state.finder[e.target.dataset.finderField]=e.target.value;refreshFinderResults();return}if(e.target?.id==='studentQuery'){state.studentQuery=e.target.value;document.getElementById('studentResults').innerHTML=studentRows();return}if(e.target?.id==='findSearch'){state.search=e.target.value;document.getElementById('searchResults').innerHTML=searchResults()}});
app.addEventListener('click',e=>{const view=e.target.closest('[data-finder-view]');if(view){state.finderSelected=view.dataset.finderView;state.classId=state.finderSelected;state.finderTab='students';state.page='class-detail';render();return}const tab=e.target.closest('[data-class-tab]');if(tab){state.finderTab=tab.dataset.classTab;render();return}const more=e.target.closest('[data-more]');if(more){e.stopPropagation();state.drawer=more.dataset.more;drawDrawer();return}const mark=e.target.closest('[data-mark]');if(mark){changeMark(mark.dataset.mark);return}const open=e.target.closest('[data-open]');if(open){openClass(open.dataset.open);return}const navBtn=e.target.closest('[data-nav]');if(navBtn){nav(navBtn.dataset.nav);return}const act=e.target.closest('[data-action]');if(!act)return;switch(act.dataset.action){case 'clearFinder':clearFinder();break;case 'toggleFinderAdvanced':state.finder.advanced=!state.finder.advanced;render();break;case 'toggleNav':state.mobileNav=!state.mobileNav;render();break;case 'closeMobileNav':state.mobileNav=false;render();break;case 'toggleSidebar':if(window.innerWidth<=640){state.mobileNav=!state.mobileNav}else if(state.page==='roll'){state.rollSidebarExpanded=!state.rollSidebarExpanded}else{state.sidebarCollapsed=!state.sidebarCollapsed}render();break;case 'toggleProfile':state.profileOpen=!state.profileOpen;render();break;case 'issueMovement':{const studentId=document.getElementById('movementStudent')?.value,destination=document.getElementById('movementDestination')?.value;if(!studentId||!destination)break;recordMovement(studentId,destination);render();showToast('Pass issued for '+getPerson(studentId).name);break}case 'returnMovement':{const item=state.movements.find(m=>m.id===act.dataset.movement);if(item&&!item.returnedAt){item.returnedAt=new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});persist();render();showToast('Student marked as returned')}break}case 'toggleNotice':{const id=act.dataset.notice;state.readNotices=state.readNotices.includes(id)?state.readNotices.filter(x=>x!==id):[...state.readNotices,id];persist();render();break}case 'search':state.search='';showModal('search');break;case 'help':showModal('help');break;case 'undo':undo();break;case 'save':state.dirty=false;persist();showToast('Attendance progress saved');break;case 'submit':if(classCounts(getClass())['?']===0&&!isSubmitted())showModal('submit');break;}});
document.addEventListener('click',e=>{const open=e.target.closest('[data-open-student]');if(open){const id=open.dataset.openStudent;closeModal();state.drawer=id;drawDrawer();return}const act=e.target.closest('[data-action]');const status=e.target.closest('[data-direct]');if(status){const id=state.drawer;closeDrawer();changeMark(id,status.dataset.direct);state.drawer=id;drawDrawer();return}if(!act||app.contains(act))return;switch(act.dataset.action){case 'closeDrawer':closeDrawer();break;case 'closeModal':closeModal();break;case 'confirmSubmit':if(classCounts(getClass())['?']===0&&!isSubmitted()){state.submitted[bucket()]={by:'Alex Morgan',at:new Date().toISOString()};state.dirty=false;state.history=[];persist();closeModal();render();showToast('Class roll submitted successfully')}break;case 'showTimetable':showModal('timetable');break;case 'createPass':showModal('pass');break;case 'confirmPass':{const id=state.drawer;if(!id)break;const d=document.getElementById('passDestination')?.value||'Toilet';state.passes[id]??=[];state.passes[id].push(`${d} pass · ${new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})}`);recordMovement(id,d);persist();closeModal();closeDrawer();state.drawer=id;drawDrawer();showToast('Pass recorded');break}case 'createNote':document.getElementById('studentNote')?.focus();break;case 'saveNote':{const id=state.drawer;state.notes[id]=document.getElementById('studentNote')?.value||'';persist();showToast('Student note saved');break}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()};if(e.target?.matches('[data-more]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}});
window.addEventListener('resize',()=>{fitGrid()});
render();
})();
</script></body></html>
