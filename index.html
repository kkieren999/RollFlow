/* RollFlow teacher sidebar — PaperCut-inspired utilitarian navigation */
:root{--navy:#102130;--navy2:#293f51;--green:#168a38;--green-dark:#0f762e}
.sidebar{width:244px;flex:0 0 244px;position:relative;transition:width .15s ease,flex-basis .15s ease;z-index:21;min-width:0}
.brand{height:84px;flex:0 0 84px;gap:10px;padding:0 15px;border-bottom:1px solid #334656}
.brand-icon-new{width:37px;height:37px;display:flex;align-items:center;justify-content:center;background:#168a38;border-radius:6px;color:#fff;flex:none}
.brand-icon-new svg{width:23px;height:23px}
.brand-word{font-size:23px;letter-spacing:-.9px;white-space:nowrap}
.brand-word small{font-size:10px;letter-spacing:1.35px;color:#aab8c3;margin-top:7px}
.side-collapse{width:23px;height:30px;margin-left:auto;border:0;background:transparent;color:#aab9c4;display:grid;place-items:center;flex:none}
.side-collapse:hover{color:#fff}
.side-nav{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#435665 transparent}
.nav-primary{padding:13px 10px 7px}
.nav-utility{padding:12px 10px 10px;border-top:1px solid #334656;margin-top:10px}
.nav-item{min-height:46px;border:0;border-radius:3px;gap:13px;padding:0 13px;margin-bottom:3px;font-size:13.5px;color:#d2dde5}
.nav-item:last-child{border:0}
.nav-item.active{background:#168a38;border:0;padding:0 13px;font-weight:700}
.nav-item.active .nav-icon{color:#fff}
.nav-item:hover{background:#1c3548;color:#fff}
.nav-item.active:hover{background:#158335}
.nav-icon{color:#b9c7d1;display:flex;align-items:center;justify-content:center;flex:0 0 20px}
.nav-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{border-top:1px solid #334656;padding:9px 10px 11px;position:relative;margin-top:0;font-size:inherit;color:inherit}
.profile-button{width:100%;display:flex;align-items:center;text-align:left;gap:10px;background:transparent;border:0;border-radius:4px;padding:9px 5px;color:#fff}
.profile-button:hover{background:#1c3548}
.profile-avatar{width:36px;height:36px;flex:none;display:grid;place-items:center;background:#314c60;color:#fff;border-radius:50%;font-size:12px;font-weight:700}
.profile-text{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.profile-text b{color:#fff;margin:0;font-size:12px}
.profile-text small{color:#aab8c3;font-size:11px}
.profile-chevrons{color:#b9c7d1;display:flex}
.profile-chevrons svg{width:16px;height:16px}
.profile-popover{position:absolute;left:13px;bottom:73px;width:241px;background:#fff;color:#324452;z-index:50;box-shadow:0 8px 36px #0004;border:1px solid #dae1e5;border-radius:4px;padding:15px;display:flex;flex-direction:column;gap:5px}
.profile-popover strong{font-size:13px}.profile-popover span{font-size:11px;color:#637581}.profile-popover button{margin-top:12px;display:flex;align-items:center;gap:9px;border:1px solid #dce2e6;padding:9px;background:#f8fafa;color:#253f52;border-radius:3px;text-align:left}
.profile-popover button:hover{background:#e9f1ef}
.sidebar.collapsed{width:66px;flex:0 0 66px}
.sidebar.collapsed .brand{height:76px;flex-basis:76px;padding:0;justify-content:center}
.sidebar.collapsed .brand-word,.sidebar.collapsed .side-collapse,.sidebar.collapsed .nav-text,.sidebar.collapsed .profile-text,.sidebar.collapsed .profile-chevrons{display:none}
.sidebar.collapsed .nav-primary,.sidebar.collapsed .nav-utility{padding-left:7px;padding-right:7px}
.sidebar.collapsed .nav-item{padding:0;justify-content:center}
.sidebar.collapsed .nav-item.active{padding:0}
.sidebar.collapsed .side-foot{padding:8px 8px 12px}
.sidebar.collapsed .profile-button{justify-content:center;padding:5px 0}
.sidebar.collapsed .profile-popover{left:60px;bottom:11px}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.edge-toggle{position:absolute;left:12px;top:10px;z-index:25;display:none;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid #65b775;background:#096d2a;color:white;box-shadow:0 2px 8px #062d162e;transition:background .15s,box-shadow .15s}

/*
 * RollFlow — Student Movements, Example 1 (Compact Dashboard)
 * Drop-in replacement for movementRows() and movementsPage() in index.html.
 * Paste this whole block IN PLACE OF those two existing functions, inside
 * RollFlow's existing <script> closure.
 *
 * This uses existing helpers, state and action handling:
 * state.movements, state.date, state.movementQuery, state.movementStudentId,
 * getPerson(), photo(), movementDuration(), niceDate(), brisbaneToday(),
 * esc(), shell(), render(), refreshMovementSuggestions(), and data-action
 * issueMovement/returnMovement. It adds only a local status-filter handler.
 *
 * Demo records remain local to the user's browser; no backend is added.
 */

// Demo-only catalogue shared between administrator and teacher logins in THIS
// browser. This is not a school server setting or cloud synchronisation.
const RF_MOVEMENT_DESTINATIONS_KEY='rollflow_demo_movement_destinations_v1';
const RF_DEFAULT_MOVEMENT_DESTINATIONS=['Toilet','Student services','School office','Library'];
function rfNormaliseMovementDestination(input){
 const name=String(input||'').trim().replace(/\s+/g,' ');
 if(name.length<2||name.length>50||!/^[A-Za-z0-9]$/.test(name.charAt(0))||/[<>"\x00-\x1f\x7f]/.test(name))
  throw Error('Use a destination name of 2–50 characters, starting with a letter or number.');
 return name;
}
function rfReadMovementDestinations(){
 try{
  const stored=JSON.parse(localStorage.getItem(RF_MOVEMENT_DESTINATIONS_KEY)||'null');
  if(!Array.isArray(stored)||!stored.length||stored.length>30)return [...RF_DEFAULT_MOVEMENT_DESTINATIONS];
  const result=[];
  for(const value of stored){
   const name=rfNormaliseMovementDestination(value);
   if(result.some(existing=>existing.toLocaleLowerCase()===name.toLocaleLowerCase()))
    return [...RF_DEFAULT_MOVEMENT_DESTINATIONS];
   result.push(name);
  }
  return result;
 }catch{return [...RF_DEFAULT_MOVEMENT_DESTINATIONS]}
}
let rfMovementDestinations=rfReadMovementDestinations();
function rfSaveMovementDestinations(next){
 if(!Array.isArray(next)||!next.length||next.length>30)
  throw Error('Keep between 1 and 30 movement destinations.');
 const cleaned=next.map(rfNormaliseMovementDestination);
 if(new Set(cleaned.map(name=>name.toLocaleLowerCase())).size!==cleaned.length)
  throw Error('Each destination needs a different name.');
 try{localStorage.setItem(RF_MOVEMENT_DESTINATIONS_KEY,JSON.stringify(cleaned))}
 catch{throw Error('Browser storage is unavailable. No destinations were changed.')}
 rfMovementDestinations=cleaned;
}
function rfMovementHistoryDestinations(){
 const history=[
  ...state.movements.map(item=>item.destination),
  ...(Array.isArray(workspace.sampleMovementHistory)?workspace.sampleMovementHistory:[]).map(item=>item.destination)
 ];
 return [...new Set([...rfMovementDestinations,...history].filter(Boolean))];
}
window.addEventListener('storage',event=>{
 if(event.key!==RF_MOVEMENT_DESTINATIONS_KEY)return;
 rfMovementDestinations=rfReadMovementDestinations();
 if((demoRole==='teacher'&&state.page==='movements')||
    (demoRole==='admin'&&adminPage==='movements'))render();
});

let rfMovementListFilter = 'all';

function rfMovementEntriesForDate() {
  // Browser-issued passes remain separate from completed fictional examples.
  // Include active earlier passes when viewing today, as before.
  const issued = state.movements
    .filter(m => m.date === state.date ||
      (state.date === brisbaneToday() && !m.returnedAt))
    .slice().reverse();
  const examples = Array.isArray(workspace.sampleMovementHistory)
    ? workspace.sampleMovementHistory.filter(m => m.sample && m.date === state.date)
      .slice().sort((a,b)=>b.time.localeCompare(a.time))
    : [];
  return [...issued, ...examples];
}

// Read-only student day review; the editable movement/pass log above is
// unchanged. A blank session cell means no movement started in that session.
const RF_MOVEMENT_DAY_PERIODS=[
 {id:'care',label:'Care class',time:'8:35–8:50 am',start:8*60+35,end:8*60+50},
 {id:'p1',label:'Period 1',time:'9:00–10:10 am',start:9*60,end:10*60+10},
 {id:'p2',label:'Period 2',time:'10:15–11:25 am',start:10*60+15,end:11*60+25},
 {id:'p3',label:'Period 3',time:'11:30 am–12:40 pm',start:11*60+30,end:12*60+40},
 {id:'p4',label:'Period 4',time:'1:20–2:30 pm',start:13*60+20,end:14*60+30}
];
let rfDayStudentId='',rfDayStudentSearch='',rfDayStudentHighlight=0;
function rfDayMovementMinutes(text){
 const match=/^(\d{1,2}):([0-5]\d)\s*(am|pm)?$/i.exec(String(text||'').trim());
 if(!match)return null;
 let hour=Number(match[1]),minute=Number(match[2]);
 if(match[3]){
  if(hour<1||hour>12)return null;
  hour=hour%12+(match[3].toLowerCase()==='pm'?12:0);
 }else if(hour>23)return null;
 return hour*60+minute;
}
function rfDayMovementPeriod(item){
 // New live passes retain their assigned school session; older passes and
 // fictional completed samples are grouped from their departure clock.
 if(RF_MOVEMENT_DAY_PERIODS.some(period=>period.id===item.session))return item.session;
 const minute=rfDayMovementMinutes(item.time);
 return RF_MOVEMENT_DAY_PERIODS.find(period=>minute!==null&&minute>=period.start&&minute<=period.end)?.id||'other';
}
function rfDayMovementStudents(){
 const query=rfDayStudentSearch.trim().toLocaleLowerCase();
 return query&&!rfDayStudentId
  ?people.filter(person=>person.name.toLocaleLowerCase().includes(query)||
     person.id.toLocaleLowerCase().includes(query)).slice(0,8)
  :[];
}
function rfDayStudentOptions(){
 return rfDayMovementStudents().map((student,index)=>
  `<button type="button" role="option" id="rf-day-option-${index}"
   aria-selected="${index===rfDayStudentHighlight}" class="rf-day-student-option ${index===rfDayStudentHighlight?'selected':''}"
   data-rf-day-student="${esc(student.id)}"><strong>${esc(student.name)}</strong><span>Year ${student.year} · ${esc(student.id)} · ${rfMovementEntriesForDate().filter(m=>m.studentId===student.id&&m.date===state.date).length} service visits this date</span></button>`
 ).join('');
}
function rfDayStudentMovements(){
 if(!rfDayStudentId)return [];
 // Use the exact same records as Movement log, including issued passes and
 // completed fictional examples, while excluding outstanding prior-day passes.
 return rfMovementEntriesForDate()
  .filter(item=>item.studentId===rfDayStudentId&&item.date===state.date)
  .sort((a,b)=>(rfDayMovementMinutes(a.time)??9999)-
                (rfDayMovementMinutes(b.time)??9999));

function rfDayMovementChip(item){

 return `<div class="rf-day-movement-entry">

  <span>${esc(item.time||'Time not recorded')} · ${item.returnedAt?'Returned '+esc(item.returnedAt):'Currently out'}${duration===null||duration===undefined?'':' · '+duration+' min'}</span>
  ${item.sample?'<small>Training record</small>':''}
 </div>`;

function rfDayStudentPeriodTable(){
 const person=getPerson(rfDayStudentId);
 const records=rfDayStudentMovements();
 const rows=RF_MOVEMENT_DAY_PERIODS.map(period=>{
  const movements=records.filter(item=>rfDayMovementPeriod(item)===period.id);
  return `<tr data-rf-day-period="${period.id}">
   <th scope="row"><strong>${period.label}</strong><small>${period.time}</small></th>
   <td class="rf-day-period-cell">${movements.map(rfDayMovementChip).join('')}</td>
  </tr>`;
 }).join('');
 const outside=records.filter(item=>rfDayMovementPeriod(item)==='other');
 return `${person?`<p class="rf-day-selected-student"><strong>${esc(person.name)}</strong> · Year ${person.year} · ${esc(person.id)} · ${esc(niceDate())} · <span class="rf-day-visit-count">${records.length} recorded service visit${records.length===1?'':'s'}</span></p>`:''}
 <div class="rf-day-period-table-wrap">

function rfDayStudentsWithVisits(){
 const students=new Map();
 rfMovementEntriesForDate().filter(item=>item.date===state.date&&getPerson(item.studentId))
  .forEach(item=>students.set(item.studentId,(students.get(item.studentId)||0)+1));
 return [...students.entries()]
  .sort((a,b)=>b[1]-a[1]||getPerson(a[0]).name.localeCompare(getPerson(b[0]).name));
}
function rfDayQuickStudentPicks(){
 const matches=rfDayStudentsWithVisits();
 if(!matches.length)return '';
 return `<div class="rf-day-quick-picks" aria-label="Students with recorded service visits for this date">

  <div>${matches.slice(0,12).map(([id,count])=>`<button type="button"
   data-rf-day-quick-student="${esc(id)}" class="rf-day-quick-pick"
   aria-pressed="${rfDayStudentId===id}">${esc(getPerson(id).name)} <strong>${count}</strong></button>`).join('')}</div>
 </div>`;

function rfDayStudentReview(){

   <div class="rf-day-student-input-row">

     <input id="rf-day-student-search" type="search" role="combobox"
      aria-autocomplete="list" aria-controls="rf-day-student-options"
      aria-expanded="${rfDayStudentStudentsVisible()}" autocomplete="off"
      placeholder="Search a student…" value="${esc(rfDayStudentSearch)}">
     <div id="rf-day-student-options" class="rf-day-student-options" role="listbox">${rfDayStudentOptions()}</div>
    </div>

  <div id="rf-day-period-result">${rfDayStudentPeriodTable()}</div>
 </section>`;

function rfDayStudentStudentsVisible(){return rfDayMovementStudents().length>0}
function rfDayStudentRefresh(){
 const options=document.getElementById('rf-day-student-options');
 const query=document.getElementById('rf-day-student-search');
 const result=document.getElementById('rf-day-period-result');
 if(options)options.innerHTML=rfDayStudentOptions();
 if(query)query.setAttribute('aria-expanded',String(rfDayStudentStudentsVisible()));
 if(result)result.innerHTML=rfDayStudentPeriodTable();
 const clear=document.querySelector('[data-rf-day-clear]');
 if(clear)clear.disabled=!rfDayStudentId&&!rfDayStudentSearch;
}
function rfDayStudentSelect(id){
 const student=getPerson(id);if(!student)return;
 rfDayStudentId=student.id;rfDayStudentSearch=student.name;
 rfDayStudentHighlight=0;
 render();
}
document.addEventListener('input',event=>{
 if(event.target?.id!=='rf-day-student-search')return;
 rfDayStudentSearch=event.target.value;rfDayStudentId='';
 rfDayStudentHighlight=0;rfDayStudentRefresh();
});
document.addEventListener('keydown',event=>{
 if(event.target?.id!=='rf-day-student-search')return;
 const matches=rfDayMovementStudents();
 if(event.key==='Escape'){rfDayStudentHighlight=0;rfDayStudentRefresh();return}
 if(!matches.length)return;
 if(event.key==='ArrowDown'||event.key==='ArrowUp'){
  event.preventDefault();
  rfDayStudentHighlight=(rfDayStudentHighlight+(event.key==='ArrowDown'?1:matches.length-1))%matches.length;
  rfDayStudentRefresh();
 }else if(event.key==='Enter'){
  event.preventDefault();rfDayStudentSelect(matches[rfDayStudentHighlight]?.id);
 }
});
document.addEventListener('click',event=>{
 const view=event.target.closest('[data-rf-view-day]');
 if(view){
  event.preventDefault();
  const person=getPerson(view.dataset.rfViewDay);
  if(!person)return;
  // An outstanding earlier pass may be shown in today's Movement log.
  // Select that pass's actual date before displaying the day's timeline.
  if(view.dataset.rfViewDate)state.date=view.dataset.rfViewDate;
  rfDayStudentSelect(person.id);
  document.querySelector('#rf-day-review-title')?.scrollIntoView({block:'start'});
  return;
 }
 const choice=event.target.closest('[data-rf-day-student],[data-rf-day-quick-student]');
 if(choice){event.preventDefault();rfDayStudentSelect(choice.dataset.rfDayStudent||choice.dataset.rfDayQuickStudent);return}
 const clear=event.target.closest('[data-rf-day-clear]');
 if(clear){event.preventDefault();rfDayStudentId='';rfDayStudentSearch='';rfDayStudentHighlight=0;render()}
});

function movementRows() {
  const visible = rfMovementEntriesForDate().filter(m =>
    rfMovementListFilter === 'all' ||
    (rfMovementListFilter === 'out' && !m.returnedAt) ||
    (rfMovementListFilter === 'returned' && !!m.returnedAt)
  );

  if (!visible.length) {
    return `<div class="rf-movement-empty">
      No ${rfMovementListFilter === 'out' ? 'active passes' :
        rfMovementListFilter === 'returned' ? 'returned passes' : 'student movements'}
      to show for this date.
    </div>`;
  }

  return `<div class="rf-movement-table-wrap">
    <table class="rf-movement-table" aria-label="Student movement log">
      <thead>
        <tr>
          <th scope="col">Student</th>
          <th scope="col">Destination</th>
          <th scope="col">Time out</th>
          <th scope="col">Duration</th>
          <th scope="col">Status</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>${visible.map(m => {
        const student = getPerson(m.studentId);
        const name = student?.name || 'Student';
        const duration = m.sample ? m.minutes : movementDuration(m);
        const avatar = student
          ? `<img src="${photo(student)}" alt="" class="rf-movement-avatar">`
          : `<span class="rf-movement-avatar rf-movement-avatar-empty" aria-hidden="true">?</span>`;

        return `<tr>
          <td>
            <div class="rf-movement-student">
              ${avatar}
              <div>
                <strong>${esc(name)}</strong>
                <small>${esc(student?.id || m.studentId || '')}${m.sample?' · Training record':''}</small>
              </div>
            </div>
          </td>
          <td>${esc(m.destination)}</td>
          <td>
            <strong>${esc(m.time)}</strong>
            <small class="rf-movement-subtext">${esc(m.date)}</small>
          </td>
          <td>
            <span data-movement-duration="${esc(m.id)}">
              ${duration === null ? 'Duration not recorded' : duration + ' min'}
            </span>
          </td>
          <td>
            <span class="rf-movement-status ${m.returnedAt ? 'is-returned' : 'is-out'}">
              ${m.returnedAt ? '✓ Returned' : '● Out'}
            </span>
          </td>
          <td>
            <div class="rf-movement-row-actions">
              ${m.returnedAt
                ? `<span class="rf-movement-return-time">${m.sample?'Training record · ':''}Returned ${esc(m.returnedAt)}</span>`
                : `<button type="button" class="rf-movement-return-button"
                     data-action="returnMovement" data-movement="${esc(m.id)}">✓ Mark returned</button>`}
              <button type="button" class="rf-movement-view-day"
                data-rf-view-day="${esc(m.studentId)}" data-rf-view-date="${esc(m.date)}"
                aria-label="Show ${esc(name)} service visits in day template">View in template</button>
            </div>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>
  </div>`;
}

function helpPage(){const body=`<div class="section-intro"><h2>Using RollFlow</h2><p>Quick help for common teacher tasks.</p></div><section class="sheet"><div class="sheet-head">ATTENDANCE MARKING</div><div class="help-steps"><div><span class="help-bubble">?</span><strong>Unmarked</strong><p>Every student starts here.</p></div><div><span class="help-bubble green-b">P</span><strong>Present</strong><p>First tap on a photo.</p></div><div><span class="help-bubble red-b">A</span><strong>Absent</strong><p>Second tap.</p></div><div><span class="help-bubble">L</span><strong>Late</strong><p>Third tap; a fourth returns to unmarked.</p></div></div><div class="help-note">Select a student’s name, right-click or long-press a photo to open details. Select Save once every student is marked. Alt+U reverses your most recent marking change before saving.</div></section><section class="sheet help-second"><div class="sheet-head">QUESTIONS</div><details open><summary>How do I submit my roll?</summary><p>Check attendance for every student. When none remain unmarked, select Save. Your completed roll is submitted immediately and a receipt appears.</p></details><details><summary>Can I correct a submitted roll?</summary><p>Open a submitted roll from My Timetable or Class Finder, tap the student's name and choose Correct attendance / late arrival. Select the new status and enter a reason. The roll stays submitted and a local correction entry is recorded. Corrections are local; school authorisation requires a secure school connection.</p></details><details><summary>How do I return to my daily schedule?</summary><p>Click the RollFlow logo. My Timetable also has Day and Week views; select a date to review the lessons scheduled for that day.</p></details><details><summary>When is a roll overdue?</summary><p>An unsubmitted scheduled roll gains a red outline 10 minutes after its lesson starts. The outline disappears after submission.</p></details><details><summary>How do I pin a supervision?</summary><p>Open Class Finder, choose All classes if needed, open the class details and select Pin as supervision. A pinned class appears in today's schedule and My Timetable until tomorrow.</p></details><details><summary>How do movement passes work?</summary><p>Issue a pass for a student from their details or Student Movements, then mark them returned. Only one active pass per student is allowed. New passes record elapsed time automatically.</p></details><details><summary>Where are my changes saved?</summary><p>Attendance is stored in this browser only. It is not connected to OneSchool or a school database. If a saving warning appears, keep the page open and retry saving.</p></details><details><summary>How do I find a student?</summary><p>Open Student Search from the left menu, search by name or ID, then select Student details.</p></details></section>`;return shell(body,'Help & Support','Teacher guide','')}

function attendanceGridLayout(count,width,height){
 const gap=width<600?6:9;
 const minWidth=width<420?69:width<630?78:82;
 const maxCols=Math.max(1,Math.min(10,count,Math.floor((width+gap)/(minWidth+gap))));
 let best=null;
 for(let cols=1;cols<=maxCols;cols++){
  const rows=Math.ceil(count/cols),tileWidth=(width-(cols-1)*gap)/cols;
  const minRowHeight=width<420?98:90;
  const rowHeight=Math.max(minRowHeight,(height-(rows-1)*gap)/rows);
  const minHeight=rows*minRowHeight+(rows-1)*gap;
  const photoHeight=Math.max(0,Math.min((tileWidth-4)*4/3,rowHeight-30));
  const fits=minHeight<=height;
  const score=photoHeight+(fits?1000:0)-(fits?0:(minHeight-height)*2)-((rows*cols-count)*0.5);
  if(!best||score>best.score)best={cols,rows,gap,minHeight,score,fits};
 }
 return best;
}
function fitGrid(){

 const count=getClass().ids.length,width=Math.max(1,wrap.clientWidth-12),height=Math.max(1,wrap.clientHeight-16);
 const layout=attendanceGridLayout(count,width,height);
 grid.style.setProperty('--cols',layout.cols);grid.style.setProperty('--rows',layout.rows);grid.style.setProperty('--photo-gap',layout.gap+'px');
 grid.style.minHeight=layout.minHeight+'px';
}

d(c.id)?`<div class="roll-supervision-banner">${supervisionLabel()}<span>Manually added to today’s timetable · clears tomorrow</span></div>`:''}<section class="sheet attendance-sheet"><div class="photo-roll-caption"><strong>${c.ids.length} students</strong><span>${locked?'Roll submitted':(c.ids.length-counts['?'])+' of '+c.ids.length+' marked'}</span></div><div class="attendance-toolbar"><div class="summary-stats"><div class="counter"><span class="digit" id="count-q">${counts['?']}</span><span>Unmarked</span></div><div class="counter green"><span class="digit" id="count-p">${counts.P}</span><span>Present</span></div><div class="counter red"><span class="digit" id="count-a">${counts.A}</span><span>Absent</span></div><div class="counter amber"><span class="digit" id="count-l">${counts.L}</span><span>Late</span></div>${counts.X?'<div class="counter blue"><span class="digit" id="count-x">'+counts.X+'</span><span>Legacy</span></div>':''}</div><div class="teacher-hint" style="${state.prefs.showHints?'':'display:none'}">Tap photo: ? → P → A → L → ? <br><span>Tap name for student details</span></div></div><div class="student-grid-wrap"><div class="student-grid">${cards}</div></div><div class="attendance-footer"><div class="footer-message" id="footerMsg">${locked?'<strong>✓ Roll submitted</strong> · Attendance is locked':counts['?']?`<strong>${counts['?']} students</strong> still need marking`:'<strong>All students marked.</strong> Ready to save.'}</div><div class="footer-actions"><button class="btn green" data-action="save" ${counts['?']||locked?'disabled':''}>${locked?'✓ Saved':'Save'}</button></div></div></section>`;return shell(body,'Take Attendance',niceDate(),'',true)}

v><div class="drawer-section-title">Class note</div><textarea class="input-note" id="studentNote" placeholder="Add a private teaching note">${esc(note)}</textarea><div style="margin-top:7px;text-align:right"><button class="btn small green" data-action="saveNote">Save note</button></div>${passes}<div class="info-line">Student photos remain fully visible in a portrait frame. Clicking a student card changes attendance; this panel opens separately.</div></div></aside>`;el.addEventListener('click',ev=>{if(ev.target===el)closeDrawer()});document.body.appendChild(el)}

function rollReminderDue(date,period,now=new Date()){

 if(starts[period]===undefined)return false;

 const value=type=>parts.find(part=>part.type===type).value;
 const today=`${value('year')}-${value('month')}-${value('day')}`;
 return date<today||(date===today&&Number(value('hour'))*60+Number(value('minute'))>=starts[period]+10);
}

function weekdayFor(date){return new Intl.DateTimeFormat('en-AU',{weekday:'long',timeZone:'Australia/Brisbane'}).format(new Date(date+'T12:00:00+10:00'))}
function dateOffset(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function scheduledClassesFor(date){
 const weekday=weekdayFor(date),plans=workspace.coverPlans.filter(p=>p.date===date);
 const pinned=date===brisbaneToday()&&state.pins.date===date?state.pins.ids:[];
 if(demoTeacherUsername==='swilliams'){
  if(sarahSchoolStatus(date))return [];
  const scheduled=sarahScheduledClasses(date),used=new Set(scheduled.map(c=>c.id));
  const extra=[...new Set([...pinned,...plans.map(p=>p.classId)])]
   .filter(id=>!used.has(id)).map(id=>schoolClasses.find(c=>c.id===id)).filter(Boolean);
  return [...scheduled,...extra].sort((a,b)=>periodForClass(a,date)-periodForClass(b,date)||a.id.localeCompare(b.id));
 }
 return [...new Set([...classes.filter(c=>c.day===weekday).map(c=>c.id),...pinned,...plans.map(p=>p.classId)])].map(id=>schoolClasses.find(c=>c.id===id)).filter(Boolean).sort((a,b)=>periodForClass(a,date)-periodForClass(b,date)||a.id.localeCompare(b.id));
}
function periodForClass(c,date){const raw=String(workspace.coverPlans.find(p=>p.date===date&&p.classId===c.id)?.period||c.period||'').trim();return /^(roll|home\s*group)$/i.test(raw)?0:Number(raw.match(/\d+/)?.[0]||99)}
function brisbaneClock(date){return date.toLocaleTimeString('en-AU',{timeZone:'Australia/Brisbane',hour:'numeric',minute:'2-digit'})}
function movementDuration(m,now=new Date()){if(!m.departedISO||m.returnedAt&&!m.returnedISO)return null;const start=Date.parse(m.departedISO),end=m.returnedISO?Date.parse(m.returnedISO):now.getTime();return Number.isFinite(start)&&Number.isFinite(end)&&end>=start?Math.floor((end-start)/60000):null}

 return pending.map(c=>`<div class="simple-row"><div><strong>${esc(c.id)} · ${esc(c.name)}</strong><span>${esc(date)} · ${esc(c.period)}</span></div><button class="btn small" data-open-report="${esc(date+'|'+c.id)}">Open roll</button></div>`).join('')||'<div class="empty-state">No outstanding scheduled rolls for this date.</div>';
}

function showStudentCorrection(){
 const id=state.drawer,p=getPerson(id),c=getClass();if(!p||!isSubmitted()||!c.ids.includes(id)){showToast('Only submitted rolls can be corrected here.');return}
 const old=statusFor(id),key=bucket();
 showReviewDialog('Correct student attendance',`<p>${esc(p.name)} · ${esc(c.id)} · ${esc(niceDate())}</p><label class="review-field">New status<select id="correction-status">${[['P','Present'],['A','Absent'],['L','Late']].map(([v,l])=>`<option value="${v}" ${old===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="review-field">Reason for correction<textarea id="correction-reason" required maxlength="500" placeholder="e.g. Student arrived late"></textarea></label><p class="settings-note">The roll remains submitted. A local correction entry records the previous and new status.</p>`,'<button class="btn" data-review-close>Cancel</button><button class="btn green" data-apply-correction>Save correction</button>');
 const dlg=document.getElementById('review-dialog');dlg.dataset.key=key;dlg.dataset.student=id;
}
function applyStudentCorrection(){
 const dlg=document.getElementById('review-dialog'),key=dlg?.dataset.key,id=dlg?.dataset.student;
 const next=document.getElementById('correction-status')?.value,reason=document.getElementById('correction-reason')?.value.trim();
 if(!reason){showToast('Enter a reason for the correction');return}
 if(!key||key!==bucket()||!state.submitted[key]||!getClass().ids.includes(id)||!['P','A','L'].includes(next))return;
 const old=statusFor(id);if(old===next){showToast('Choose a different attendance status');return}
 state.marks[key]??={};state.marks[key][id]=next;
 if(!persist()){state.marks[key][id]=old;return}
 const audited=recordAudit('Student attendance corrected',key+' · '+getPerson(id).name+' · '+old+' → '+next+' · '+reason);
 dlg.remove();closeDrawer();render();showToast(audited?'Attendance correction saved':'Correction saved, but the local history entry could not be saved.');
}

function preferredAttendanceClass(now=new Date()){
 const plans=workspace.coverPlans.filter(p=>p.date===state.date);
 const list=scheduledClassesFor(state.date);
 const period=cls=>{const raw=String(plans.find(p=>p.classId===cls.id)?.period||cls.period||'').trim();return /^(roll|home\s*group)$/i.test(raw)?0:Number(raw.match(/\d+/)?.[0]||99)};
 const times={0:[515,530],1:[540,610],2:[615,685],3:[690,760],4:[800,870],5:[875,910]};
 const parts=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Brisbane',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);
 const minute=Number(parts.find(p=>p.type==='hour').value)*60+Number(parts.find(p=>p.type==='minute').value);
 const ordered=list.sort((a,b)=>period(a)-period(b));
 return ordered.find(c=>!isSubmitted(c.id)&&times[period(c)]&&minute>=times[period(c)][0]&&minute<times[period(c)][1])
 ||ordered.find(c=>!isSubmitted(c.id)&&times[period(c)]&&minute<times[period(c)][0])
 ||ordered.find(c=>!isSubmitted(c.id))||ordered[0]||null;
}

timetable=function(){

 const windows={0:[515,530],1:[540,610],2:[615,685],3:[690,760],4:[800,870],5:[875,910]};
 const dayData=days.map(d=>({d,list:scheduledClassesFor(d)}));
 const periodKeys=[...new Set([0,1,2,3,4,5,...dayData.flatMap(({d,list})=>list.map(c=>periodForClass(c,d)))])].sort((a,b)=>a-b);
 const panels=dayData.map(({d,list})=>{
 const occupied=new Set(list.map(c=>periodForClass(c,d)));
 const preparations=demoTeacherUsername==='swilliams'&&!sarahSchoolStatus(d)
  ?[1,2,3,4,5].filter(n=>!occupied.has(n)).map(n=>({
    id:'',name:'Spare',room:'Staffroom',
    period:'PERIOD '+n,time:SARAH_2026_PERIOD_TIMES[n],isPlanning:true
   })):[];
 const displayRows=[...list,...preparations].sort((a,b)=>periodForClass(a,d)-periodForClass(b,d));
 const headingDate=new Date(d+'T12:00:00+10:00'),shortDate=headingDate.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'Australia/Brisbane'}),longDate=headingDate.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',timeZone:'Australia/Brisbane'});
 const dayHeading=`<div class="day-panel-heading ${week&&d===date?'rf-selected-day':''}"><h2>${week?`<button type="button" class="rf-week-day-link" data-rf-week-day="${esc(d)}" aria-label="Open ${esc(longDate)} day view">${esc(shortDate)}</button>`:esc(longDate)}</h2><p>${list.length} ${week?'lessons':'scheduled session'+(list.length===1?'':'s')}${demoTeacherUsername==='swilliams'?' · '+preparations.length+' spare'+(preparations.length===1?'':'s'):''}</p>${week&&!displayRows.length?`<span class="rf-week-empty-note">${esc((demoTeacherUsername==='swilliams'?sarahSchoolStatus(d):'')||'No scheduled lessons')}</span>`:''}</div>`;

 const plan=workspace.coverPlans.find(x=>x.date===d&&x.classId===c.id),done=!!state.submitted[d+'|'+c.id],overdue=!done&&rollReminderDue(d,p),current=d===brisbaneToday()&&windows[p]&&minute>=windows[p][0]&&minute<windows[p][1],cover=!c.myClass;
 return `<article class="day-lesson simple-row rf-timetable-card ${overdue?'roll-overdue':''} ${current&&!done?'lesson-current':''} ${cover?'schedule-cover':''}" data-timetable-class="${esc(c.id)}" data-timetable-date="${esc(d)}" data-rf-motion="${esc(d+'|'+c.id+'|'+p)}" data-rf-period="${p}" data-rf-roll-status="${done?'submitted':overdue?'overdue':current?'current':'pending'}"><div class="lesson-time"><strong>${esc(times[p]||c.time)}</strong><span>${p===0?'Home group':p===99?esc(plan?.period||c.period):'Period '+p}</span></div><div class="lesson-details"><div class="lesson-title"><h3>${esc(c.name)}</h3>${cover?(d===brisbaneToday()&&pinnedToday(c.id)?'<span class="cover-badge">SUPERVISION</span>':'<span class="cover-badge">COVER CLASS</span>'):''}</div><p>${esc(c.id)} · Room ${esc(plan?.room||c.room)}</p>${overdue&&!week?'<span class="lesson-overdue">Roll overdue</span>':''}</div><div class="lesson-actions"><span class="lesson-status">${week?(done?'✓ Submitted':overdue?'Roll overdue':current?'In progress':d>brisbaneToday()?'':'Not submitted'):(done?'✓ Submitted':current?'In progress':overdue?'':'Not submitted')}</span><button type="button" class="btn small ${week?'rf-quiet-roll':current&&!done?'green':''}" data-open-report="${esc(d+'|'+c.id)}" aria-label="${done?'View':'Open'} roll for ${esc(c.id)} on ${esc(longDate)}">${week?(done?'View':'Open')+' <span aria-hidden="true">›</span>':done?'View roll':'Open roll'}</button></div></article>`;

function osStrictCsv(raw){

 for(let i=0;i<raw.length;i++){
  const c=raw[i];
  if(mode===1){if(c==='"'){if(raw[i+1]==='"'){cell+='"';i++}else mode=2}else cell+=c;continue}
  if(c===','){field();continue}
  if(c==='\r'||c==='\n'){if(c==='\r'&&raw[i+1]==='\n')i++;record();continue}
  if(mode===2)throw Error('Unexpected character after closing quote on record '+(rows.length+1));
  if(c==='"'){if(cell.length)throw Error('Unexpected quote in unquoted field on record '+(rows.length+1));mode=1;continue}

}

function clearDemoOverlays(){
 state.drawer=null;state.modal=null;state.profileOpen=false;state.mobileNav=false;
 document.querySelectorAll('#overlay,#modal,#review-dialog,.toast').forEach(el=>el.remove());
}
function setDemoRole(role){
 const targetTeacher=role==='swilliams'?'swilliams':'teacher';
 const teacherChanged=demoTeacherUsername!==targetTeacher;
 demoTeacherUsername=targetTeacher;
 demoRole=role==='swilliams'?'teacher':role;
 try{if(role)sessionStorage.setItem(DEMO_AUTH_KEY,role);else sessionStorage.removeItem(DEMO_AUTH_KEY)}catch{}
 // A full fresh load resets ALL cross-cutting demo-only state (attendance,
 // planner and workspace) before another fictional teacher signs in.
 if(teacherChanged){window.location.reload();return}
 osEpoch++;osWide=false;osSetView(false);osResetFilters();
 clearDemoOverlays();state.history=[];profileEditing=false;
 if(demoRole==='teacher'){
  state.date=brisbaneToday();state.page=['home','timetable','roll'].includes(workspace.settings.landing)?workspace.settings.landing:'home';
  if(state.page==='roll'){const c=preferredAttendanceClass();if(c)state.classId=c.id;else state.page='timetable'}
 }
 render();
}

function showPreviewTeacherPlan(){
 if(osPublished()){osSetView(true);osResetFilters();state.page='master';render();return}
 const slots=planning.slots.filter(x=>x.active&&x.teacher===demoTeacherUsername&&planning.classes.some(c=>c.code===x.classCode&&c.active)&&planning.rooms.some(r=>r.code===x.room&&r.active)&&planning.periods.some(p=>p.code===x.period&&p.active!==false));
 const body='<p>Read-only planning timetable.</p>'+planDays.map((day,i)=>{
 const entries=slots.filter(x=>x.day===i+1).sort((a,b)=>(planning.periods.find(p=>p.code===a.period)?.start||'').localeCompare(planning.periods.find(p=>p.code===b.period)?.start||''));
 return '<h3 style="margin-top:16px">'+esc(day)+'</h3>'+entries.map(x=>{const p=planning.periods.find(p=>p.code===x.period),c=planning.classes.find(c=>c.code===x.classCode);return '<div class="simple-row"><div><strong>'+esc(x.classCode+' · '+(c?.name||''))+'</strong><span>'+esc((p?.label||'')+' · '+(p?.start||'')+'–'+(p?.end||'')+' · Room '+x.room)+'</span></div></div>'}).join('')+(entries.length?'':'<p>No planned lessons.</p>');
 }).join('');
 showReviewDialog('My planned timetable',body);
}
