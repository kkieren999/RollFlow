/* RollFlow teacher sidebar — PaperCut-inspired utilitarian navigation */
:root{--navy:#102130;--navy2:#293f51;--green:#168a38;--green-dark:#0f762e}
.sidebar{width:244px;flex:0 0 244px;position:relative;transition:width .15s ease,flex-basis .15s ease;z-index:21;min-width:0}
.brand{height:84px;flex:0 0 84px;gap:10px;padding:0 15px;border-bottom:1px solid #334656}
.brand-icon-new{width:37px;height:37px;display:flex;align-items:center;justify-content:center;background:#168a38;border-radius:6px;color:#fff;flex:none}
.brand-icon-new svg{width:23px;height:23px}
.brand-word{font-size:23px;letter-spacing:-.9px;white-space:nowrap}
.brand-word small{font-size:10px;letter-spacing:1.35px;color:#aab8c3;margin-top:7px}
.side-collapse{width:23px;height:30px;margin-left:auto;border:0;background:transparent;color:#aab9c4;display:grid;place-items:center;flex:none}
.side-collapse:hover{color:#fff}
.side-nav{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#435665 transparent}
.nav-primary{padding:13px 10px 7px}
.nav-utility{padding:12px 10px 10px;border-top:1px solid #334656;margin-top:10px}
.nav-item{min-height:46px;border:0;border-radius:3px;gap:13px;padding:0 13px;margin-bottom:3px;font-size:13.5px;color:#d2dde5}
.nav-item:last-child{border:0}
.nav-item.active{background:#168a38;border:0;padding:0 13px;font-weight:700}
.nav-item.active .nav-icon{color:#fff}
.nav-item:hover{background:#1c3548;color:#fff}
.nav-item.active:hover{background:#158335}
.nav-icon{color:#b9c7d1;display:flex;align-items:center;justify-content:center;flex:0 0 20px}
.nav-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{border-top:1px solid #334656;padding:9px 10px 11px;position:relative;margin-top:0;font-size:inherit;color:inherit}
.profile-button{width:100%;display:flex;align-items:center;text-align:left;gap:10px;background:transparent;border:0;border-radius:4px;padding:9px 5px;color:#fff}
.profile-button:hover{background:#1c3548}
.profile-avatar{width:36px;height:36px;flex:none;display:grid;place-items:center;background:#314c60;color:#fff;border-radius:50%;font-size:12px;font-weight:700}
.profile-text{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.profile-text b{color:#fff;margin:0;font-size:12px}
.profile-text small{color:#aab8c3;font-size:11px}
.profile-chevrons{color:#b9c7d1;display:flex}
.profile-chevrons svg{width:16px;height:16px}
.profile-popover{position:absolute;left:13px;bottom:73px;width:241px;background:#fff;color:#324452;z-index:50;box-shadow:0 8px 36px #0004;border:1px solid #dae1e5;border-radius:4px;padding:15px;display:flex;flex-direction:column;gap:5px}
.profile-popover strong{font-size:13px}.profile-popover span{font-size:11px;color:#637581}.profile-popover button{margin-top:12px;display:flex;align-items:center;gap:9px;border:1px solid #dce2e6;padding:9px;background:#f8fafa;color:#253f52;border-radius:3px;text-align:left}
.profile-popover button:hover{background:#e9f1ef}
.sidebar.collapsed{width:66px;flex:0 0 66px}
.sidebar.collapsed .brand{height:76px;flex-basis:76px;padding:0;justify-content:center}
.sidebar.collapsed .brand-word,.sidebar.collapsed .side-collapse,.sidebar.collapsed .nav-text,.sidebar.collapsed .profile-text,.sidebar.collapsed .profile-chevrons{display:none}
.sidebar.collapsed .nav-primary,.sidebar.collapsed .nav-utility{padding-left:7px;padding-right:7px}
.sidebar.collapsed .nav-item{padding:0;justify-content:center}
.sidebar.collapsed .nav-item.active{padding:0}
.sidebar.collapsed .side-foot{padding:8px 8px 12px}
.sidebar.collapsed .profile-button{justify-content:center;padding:5px 0}
.sidebar.collapsed .profile-popover{left:60px;bottom:11px}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.edge-toggle{position:absolute;left:12px;top:10px;z-index:25;display:none;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid #65b775;background:#096d2a;color:white;box-shadow:0 2px 8px #062d162e;transition:background .15s,box-shadow .15s}

function attendanceGridLayout(count,width,height){
 const gap=width<600?6:9;
 const minWidth=width<420?69:width<630?78:82;
 const maxCols=Math.max(1,Math.min(10,count,Math.floor((width+gap)/(minWidth+gap))));
 let best=null;
 for(let cols=1;cols<=maxCols;cols++){
  const rows=Math.ceil(count/cols),tileWidth=(width-(cols-1)*gap)/cols;
  const minRowHeight=width<420?98:90;
  const rowHeight=Math.max(minRowHeight,(height-(rows-1)*gap)/rows);
  const minHeight=rows*minRowHeight+(rows-1)*gap;
  const photoHeight=Math.max(0,Math.min((tileWidth-4)*4/3,rowHeight-30));
  const fits=minHeight<=height;
  const score=photoHeight+(fits?1000:0)-(fits?0:(minHeight-height)*2)-((rows*cols-count)*0.5);
  if(!best||score>best.score)best={cols,rows,gap,minHeight,score,fits};
 }
 return best;
}

function scheduledRollOverdue(cls,now=new Date()){
 if(!cls||isSubmitted(cls.id))return false;
 const plan=workspace.coverPlans.find(item=>item.date===state.date&&item.classId===cls.id);
 if(!scheduledClassesFor(state.date).some(c=>c.id===cls.id))return false;
 const raw=String(plan?.period||cls.period||'').trim();

function rollReminderDue(date,period,now=new Date()){
 const starts={0:515,1:540,2:615,3:690,4:800,5:875};
 if(starts[period]===undefined)return false;
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Brisbane',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);
 const value=type=>parts.find(part=>part.type===type).value;
 const today=`${value('year')}-${value('month')}-${value('day')}`;
 return date<today||(date===today&&Number(value('hour'))*60+Number(value('minute'))>=starts[period]+10);
}

 const list=scheduledClassesFor(state.date);
 const period=cls=>{const raw=String(plans.find(p=>p.classId===cls.id)?.period||cls.period||'').trim();return /^(roll|home\s*group)$/i.test(raw)?0:Number(raw.match(/\d+/)?.[0]||99)};
 const times={0:[515,530],1:[540,610],2:[615,685],3:[690,760],4:[800,870],5:[875,910]};
 const parts=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Brisbane',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);
 const minute=Number(parts.find(p=>p.type==='hour').value)*60+Number(parts.find(p=>p.type==='minute').value);
 const ordered=list.sort((a,b)=>period(a)-period(b));
 return ordered.find(c=>!isSubmitted(c.id)&&times[period(c)]&&minute>=times[period(c)][0]&&minute<times[period(c)][1])
 ||ordered.find(c=>!isSubmitted(c.id)&&times[period(c)]&&minute<times[period(c)][0])
 ||ordered.find(c=>!isSubmitted(c.id))||ordered[0]||null;
}

timetable=function(){
 const date=state.date,week=workspace.settings.timetableView==='week',weekday=new Date(date+'T12:00:00Z').getUTCDay(),monday=dateOffset(date,-((weekday+6)%7));
 const days=week?Array.from({length:5},(_,i)=>dateOffset(monday,i)):[date];
 const times={0:'8:35–8:50 am',1:'9:00–10:10 am',2:'10:15–11:25 am',3:'11:30 am–12:40 pm',4:'1:20–2:30 pm',5:'2:35–3:10 pm'};
 const parts=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Brisbane',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),minute=Number(parts.find(p=>p.type==='hour').value)*60+Number(parts.find(p=>p.type==='minute').value);
 const windows={0:[515,530],1:[540,610],2:[615,685],3:[690,760],4:[800,870],5:[875,910]};
 const panels=days.map(d=>{
 const list=scheduledClassesFor(d);
 return `<section class="sheet day-schedule timetable-day"><div class="day-panel-heading"><h2>${esc(new Date(d+'T12:00:00+10:00').toLocaleDateString('en-AU',{timeZone:'Australia/Brisbane',weekday:'long',day:'numeric',month:'long'}))}</h2><p>${list.length} scheduled lesson${list.length===1?'':'s'}</p></div><div class="day-lessons">${list.map(c=>{
 const p=periodForClass(c,d),plan=workspace.coverPlans.find(x=>x.date===d&&x.classId===c.id),done=!!state.submitted[d+'|'+c.id],overdue=!done&&rollReminderDue(d,p),current=d===brisbaneToday()&&windows[p]&&minute>=windows[p][0]&&minute<windows[p][1],cover=!c.myClass;
 return `<article class="day-lesson simple-row ${overdue?'roll-overdue':''} ${current&&!done?'lesson-current':''} ${cover?'schedule-cover':''}" data-timetable-class="${esc(c.id)}" data-timetable-date="${esc(d)}"><div class="lesson-time"><strong>${esc(times[p]||c.time)}</strong><span>${p===0?'Home group':p===99?esc(plan?.period||c.period):'Period '+p}</span></div><div class="lesson-details"><div class="lesson-title"><h3>${esc(c.name)}</h3>${cover?(d===brisbaneToday()&&pinnedToday(c.id)?'<span class="cover-badge">SUPERVISION</span>':'<span class="cover-badge">COVER CLASS</span>'):''}</div><p>${esc(c.id)} · Room ${esc(plan?.room||c.room)}</p>${overdue?'<span class="lesson-overdue">Roll overdue</span>':''}</div><div class="lesson-actions"><span class="lesson-status">${done?'✓ Submitted':current?'In progress':overdue?'':'Not submitted'}</span><button class="btn small ${current&&!done?'green':''}" data-open-report="${esc(d+'|'+c.id)}">${done?'View roll':'Open roll'}</button></div></article>`;
 }).join('')||'<div class="empty-state">No sample lessons scheduled for this day.</div>'}</div></section>`;
 }).join('');
 return shell(`<div class="timetable-new">${panels}</div>`,'My Timetable','Your assigned lessons and pinned supervisions',`<label class="date-filter">Date <input type="date" class="field-date" data-date value="${esc(date)}"></label>`);

}

function clearDemoOverlays(){
 state.drawer=null;state.modal=null;state.profileOpen=false;state.mobileNav=false;
 document.querySelectorAll('#overlay,#modal,#review-dialog,.toast').forEach(el=>el.remove());
}
function setDemoRole(role){
 demoRole=role;
 try{if(role)sessionStorage.setItem(DEMO_AUTH_KEY,role);else sessionStorage.removeItem(DEMO_AUTH_KEY)}catch{}
 clearDemoOverlays();state.history=[];profileEditing=false;
 if(role==='teacher'){
  state.date=brisbaneToday();state.page=['home','timetable','roll'].includes(workspace.settings.landing)?workspace.settings.landing:'home';
  if(state.page==='roll'){const c=preferredAttendanceClass();if(c)state.classId=c.id;else state.page='timetable'}
 }
 render();
}

function showPreviewTeacherPlan(){
 const slots=planning.slots.filter(x=>x.active&&x.teacher==='teacher'&&planning.classes.some(c=>c.code===x.classCode&&c.active)&&planning.rooms.some(r=>r.code===x.room&&r.active));
 const body='<p>Read-only weekly schedule from the administration planning preview. Roll marking still uses the original fictional timetable.</p>'+planDays.map((day,i)=>{
 const entries=slots.filter(x=>x.day===i+1).sort((a,b)=>(planning.periods.find(p=>p.code===a.period)?.start||'').localeCompare(planning.periods.find(p=>p.code===b.period)?.start||''));
 return '<h3 style="margin-top:16px">'+esc(day)+'</h3>'+entries.map(x=>{const p=planning.periods.find(p=>p.code===x.period),c=planning.classes.find(c=>c.code===x.classCode);return '<div class="simple-row"><div><strong>'+esc(x.classCode+' · '+(c?.name||''))+'</strong><span>'+esc((p?.label||'')+' · '+(p?.start||'')+'–'+(p?.end||'')+' · Room '+x.room)+'</span></div></div>'}).join('')+(entries.length?'':'<p>No planned lessons.</p>');
 }).join('');
 showReviewDialog('My planned timetable',body);
}
document.addEventListener('click',e=>{
 if(demoRole==='teacher'&&e.target.closest('[data-v33-teacher-plan]')){e.stopImmediatePropagation();showPreviewTeacherPlan()}
},true);

 }

document.addEventListener('submit',event=>{

 event.preventDefault();event.stopImmediatePropagation();
 if(demoRole)return;
 const data=new FormData(event.target),role=checkDemoCredentials(loginMode,String(data.get('username')||''),String(data.get('password')||''));
 if(!role){const error=document.getElementById('demo-login-error');error.hidden=false;error.textContent='Incorrect demo credentials. Use admin / admin or teacher / teacher.';document.getElementById('demo-password').focus();return}

document.addEventListener('click',event=>{

},true);
