name: V3 foundation tests
on:
  workflow_dispatch:
  push:
    branches: [v3.0-foundation]
  pull_request:
    branches: [main, v3.0-foundation]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      ROLLFLOW_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip download --only-binary=:all: -r requirements.txt -d wheelhouse
          python -m pip install --no-index --find-links=wheelhouse -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test accounts
  postgres-and-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - run: python deployment/ci_smoke.py
