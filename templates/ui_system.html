{# Shared offline design tokens for native RollFlow templates. #}
<style>
:root{
  color-scheme:light;
  --rf-navy:#112332;
  --rf-navy-soft:#263e4e;
  --rf-green:#147f38;
  --rf-green-hover:#0d6f2d;
  --rf-green-faint:#eaf5ed;
  --rf-paper:#ffffff;
  --rf-canvas:#f0f4f6;
  --rf-border:#d7e3e8;
  --rf-ink:#253c49;
  --rf-muted:#546e7c;
  --rf-link:#075f85;
  --rf-focus:#e5ad2b;
  --rf-danger:#9c3030;
  --rf-warning:#a36d19;
  --rf-radius:10px;
  --rf-shadow:0 1px 3px rgba(17,35,50,.07);
}
html{scroll-padding-top:18px}
body{background:var(--rf-canvas);color:var(--rf-ink);font-family:Arial,Helvetica,sans-serif}
a{color:var(--rf-link);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:where(a,button,input,textarea,select,summary,[tabindex]):focus-visible{
  outline:3px solid var(--rf-focus)!important;outline-offset:3px!important;
}
:where(button,input,select,textarea){font-family:inherit}
:where(button,[type=submit],.btn):disabled{opacity:.55;cursor:not-allowed}
.rf-skip{
 position:fixed;z-index:9999;left:10px;top:8px;
 transform:translateY(-170%);background:#fff;color:#142f41;
 border:2px solid var(--rf-focus);padding:9px 13px;border-radius:6px;
 font-weight:700;text-decoration:none
}
.rf-skip:focus,.rf-skip:focus-visible{transform:translateY(0)}
header.rf-appbar{
 background:var(--rf-navy);color:#fff;
 border-bottom:4px solid var(--rf-green);
 display:flex;align-items:center;justify-content:space-between;
 gap:14px;flex-wrap:wrap;
 padding:12px max(16px,calc((100% - 1360px)/2));
 min-height:72px
}
.rf-appbar .rf-brand{
 display:inline-flex;align-items:center;gap:10px;color:white;text-decoration:none;
 font-size:21px;font-weight:700;line-height:1.15
}
.rf-brand .rf-mark{
 background:var(--rf-green);color:#fff;
 font-size:13px;font-weight:700;display:grid;place-items:center;
 width:37px;height:37px;border-radius:8px;flex:none;
}
.rf-brand .rf-portal-label{
 display:block;font-size:10px;font-weight:700;letter-spacing:.085em;color:#c4d7df;margin-top:3px;
}
.rf-appbar .rf-nav{
 display:flex;gap:4px;align-items:center;flex-wrap:wrap;
 margin-left:auto;max-width:100%;
}
.rf-appbar .rf-navlink{
 color:#eaf3f5;background:transparent;text-decoration:none;
 display:inline-flex;align-items:center;min-height:40px;padding:8px 11px;
 border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap;
}
.rf-appbar .rf-navlink:hover{background:var(--rf-navy-soft);color:white;text-decoration:none}
.rf-appbar .rf-navlink[aria-current="page"]{
 background:var(--rf-green);color:white;
}
.rf-appbar form{margin:0}
.rf-appbar .rf-signout{
 background:transparent;border:1px solid #8faab7;color:white;
 border-radius:7px;padding:8px 12px;min-height:40px;
 font-size:13px;font-weight:600;cursor:pointer;
}
.rf-appbar .rf-signout:hover{background:#284452;color:white}
.rf-page{
 max-width:1360px;margin:0 auto;
 padding:clamp(16px,2.5vw,30px) clamp(12px,2vw,24px) 48px;
 min-width:0
}
.rf-page h1{font-size:clamp(24px,2.4vw,30px);line-height:1.2;letter-spacing:-.025em;color:#193142;margin:0 0 10px}
.rf-page h2{font-size:19px;color:#1d3645;line-height:1.35}
.rf-page h3{font-size:16px;color:#253f4d}
.rf-page p,.rf-page .muted,.rf-page .hint,.rf-page small{line-height:1.55}
.rf-page .panel,.rf-page .card,.rf-page .day{
 border:1px solid var(--rf-border);border-radius:var(--rf-radius);
 box-shadow:var(--rf-shadow);background:var(--rf-paper)
}
.rf-page .panel,.rf-page .card{padding:clamp(14px,2vw,22px)}
.rf-page .panel{margin:16px 0}
.rf-page .panel h2:first-child{margin-top:0}
.rf-page .scroll,.rf-page .table-wrap,.rf-page .wrap{
 max-width:100%;overflow-x:auto;overscroll-behavior-x:contain
}
.rf-page table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.rf-page th,.rf-page td{padding:11px 12px;text-align:left;border-bottom:1px solid #e1e9ed;vertical-align:top}
.rf-page th{font-size:12px;color:#3d5968;background:#eff4f6;font-weight:700;white-space:nowrap}
.rf-page tbody tr:hover{background:#f7fafb}
.rf-page tbody tr:last-child td{border-bottom:0}
.rf-page .btn,.rf-page button:not(.rf-signout){
 display:inline-flex;align-items:center;justify-content:center;gap:7px;
 min-height:40px;max-width:100%;padding:9px 13px;
 border:1px solid #9eb6c1;border-radius:7px;
 background:#fff;color:var(--rf-ink);font-weight:650;
 text-decoration:none;line-height:1.3;cursor:pointer
}
.rf-page :is(.btn.primary,button.primary,button[type=submit]:not(.secondary):not(.danger),button[name=action][value=publish],button[name=action][value=prepare],button[name=action][value=activate]){
 background:var(--rf-green);border-color:var(--rf-green);color:#fff
}
.rf-page :is(.btn.primary,button.primary,button[type=submit]:not(.secondary):not(.danger)):hover{
 background:var(--rf-green-hover);border-color:var(--rf-green-hover);color:#fff
}
.rf-page button.danger,.rf-page .btn.danger{border-color:#dbb2b2;color:var(--rf-danger);background:#fffafa}
.rf-page input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=submit]),
.rf-page select,.rf-page textarea{
 min-height:40px;border:1px solid #a4bac5;border-radius:7px;
 background:#fff;color:var(--rf-ink);
 padding:9px 10px;max-width:100%;font:inherit
}
.rf-page input[type=checkbox],.rf-page input[type=radio]{accent-color:var(--rf-green);width:17px;height:17px;vertical-align:middle}
.rf-page input[type=time]{width:112px}
.rf-page label{color:#304c5b}
.rf-page .note,.rf-page .notice,.rf-page .info{
 border-left:4px solid var(--rf-green);background:var(--rf-green-faint);
 color:#274b3a;border-radius:6px;padding:12px 15px
}
.rf-page .note.warn,.rf-page .warning,.rf-page .note.warning{border-left-color:var(--rf-warning);background:#fff8e9;color:#644a1c}
.rf-page .error,.rf-page .errorlist,.rf-page .notice.error,.rf-page [role=alert]{color:#8c232c}
.rf-page .notice.error,.rf-page [role=alert]{border-left-color:#b03c42;background:#fff3f3}
.rf-page .actions,.rf-page .links{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.rf-page .metric{background:#f1f6f8;border:1px solid #e3ebef;border-radius:8px;padding:13px}
.rf-page .metric strong{color:#213e4b}
.rf-page .day-head{background:#eaf1f3}
.rf-page .message.success,.rf-page .success{border-left:4px solid var(--rf-green);background:#eaf5ed;color:#215a34}
.rf-page .pagination,.rf-page nav[aria-label*="navigation"]{flex-wrap:wrap}
.rf-page .empty{border:1px dashed var(--rf-border);border-radius:8px;padding:20px;background:#fafcfd;color:var(--rf-muted)}
.rf-page .rf-page-intro{color:var(--rf-muted);max-width:900px;margin:7px 0 18px}
.rf-page .rf-page-actions{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}
.rf-page .rf-time-grid{overflow:auto}
.rf-page .rf-time-grid th:first-child,.rf-page .rf-time-grid td:first-child{font-weight:700;min-width:80px}
.rf-page .rf-time-grid td{min-width:235px}
.rf-page .rf-time-pair{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.rf-page .rf-time-pair label{display:block;font-size:11px;color:var(--rf-muted)}
.rf-page .rf-time-pair input[type=time]{font-size:13px;min-height:39px;max-width:105px;padding:6px}
.rf-page .rf-time-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.rf-legacy-admin .sidebar{background:var(--rf-navy)}
.rf-legacy-admin .top{background:var(--rf-green)}
.rf-legacy-admin .nav-link[aria-current="page"]{background:var(--rf-green);color:white}
.rf-legacy-admin .btn.primary{background:var(--rf-green);border-color:var(--rf-green)}
.rf-legacy-admin .nav-link{min-height:40px}
.rf-legacy-admin .main{min-width:0}
.rf-legacy-admin .main>.panel{box-shadow:var(--rf-shadow);border-color:var(--rf-border)}
.rf-legacy-admin .eyebrow{color:#27783e}
.rf-legacy-admin :is(button,input,select,textarea):focus-visible,.rf-legacy-admin a:focus-visible{outline:3px solid var(--rf-focus);outline-offset:3px}
@media(max-width:900px){
 .rf-appbar .rf-nav{order:3;flex-basis:100%;display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0}
 .rf-appbar .rf-navlink{flex:none}
 .rf-appbar form{margin-left:auto}
}
@media(max-width:640px){
 .rf-page{padding:15px 12px 35px}
 .rf-page th,.rf-page td{padding:9px 10px}
 .rf-page .panel,.rf-page .card{padding:14px}
 .rf-legacy-admin .main{padding:14px 12px}
 .rf-legacy-admin .nav-link{min-height:44px}
 .rf-appbar{padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* School-specific branding; neutral surfaces and semantic feedback stay standard. */
:root{--school-primary:#193a80;--school-secondary:#0076a8;--school-secondary-end:#007e9f;--school-accent:#ffc928;--rf-heading-gradient:linear-gradient(110deg,var(--school-secondary),var(--school-secondary-end));--rf-canvas:#edf0f2}
header.rf-appbar,.rf-legacy-admin .top,body.rf-login>header{background:var(--school-primary);border-bottom:3px solid var(--school-accent)}
.rf-brand .rf-mark,.rf-legacy-admin .brand-icon{background:var(--school-primary)}
.rf-appbar .rf-navlink[aria-current="page"],.rf-legacy-admin .nav-link[aria-current="page"]{background:var(--rf-navy-soft);box-shadow:inset 3px 0 var(--school-accent);color:white}
.rf-page :is(.btn.primary,button.primary,button[type=submit]:not(.secondary):not(.danger),button[name=action][value=publish],button[name=action][value=prepare],button[name=action][value=activate]),.rf-legacy-admin .btn.primary,body.rf-login .card button{background:var(--school-primary);border-color:var(--school-primary);color:white}
.rf-page :is(.btn.primary,button.primary,button[type=submit]:not(.secondary):not(.danger)):hover,.rf-legacy-admin .btn.primary:hover{background:var(--school-secondary);border-color:var(--school-secondary)}
.rf-page>h1,.rf-legacy-admin .main>.title,body.rf-login .card>h1{background:var(--rf-heading-gradient);color:#fff;border:1px solid #dbe4e6;border-radius:10px 10px 0 0;padding:16px 21px;margin:0;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.rf-legacy-admin .main>.title h1,.rf-legacy-admin .main>.title .eyebrow{color:white}
.rf-page>h1+p,.rf-page>h1+.rf-page-intro,body.rf-login .card>h1+p{background:#f9fbfb;color:#243a48;border:1px solid #dbe4e6;border-top:0;border-radius:0 0 10px 10px;padding:13px 21px;min-height:48px;margin:0 0 12px;font-weight:700}
@media(max-width:900px){.rf-page>h1,.rf-legacy-admin .main>.title,body.rf-login .card>h1{font-size:22px;padding:12px 14px}.rf-page>h1+p,.rf-page>h1+.rf-page-intro{padding:11px 14px}}

@media screen{
.rf-page{width:100%;max-width:1800px;min-width:0;padding:clamp(12px,1.5vw,24px)}
.rf-page>*{min-width:0;max-width:100%}
.rf-page .scroll,.rf-page .table-wrap,.rf-page .mt-scroll,.rf-page .rf-table-wrap{min-width:0;max-width:100%;overflow-x:auto}
.rf-page .panel,.rf-page .card{min-width:0;max-width:100%}
.rf-page form input:not([type=checkbox]):not([type=radio]),.rf-page select,.rf-page textarea{max-width:100%;min-width:0}
.rf-legacy-admin .main{min-width:0;max-width:100%;overflow-x:auto}
.rf-page .actions,.rf-page .rf-page-actions{flex-wrap:wrap}
@media(pointer:coarse){.rf-page .btn,.rf-appbar .rf-navlink,.rf-appbar .rf-signout{min-height:44px}}
}
</style>
