<form method="get" class="rf-directory-filters"><div><label for="rf-search">Search</label><input id="rf-search" name="q" value="{{ q }}" maxlength="100" placeholder="{{ search_placeholder }}"></div><div><label for="rf-year">Year level</label><select id="rf-year" name="year"><option value="">All years</option>{% for y in years %}<option value="{{ y }}" {% if year == y|stringformat:"s" %}selected{% endif %}>Year {{ y }}</option>{% endfor %}</select></div><button type="submit">Search</button><a class="rf-tool-btn" href="{{ request.path }}">Clear</a></form>
